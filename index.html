<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kauwe Bende · One Screen Mobile</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
    :root{--green:#092716;--green2:#143c24;--gold:#f7d44a;--ink:#102118;--shadow:0 12px 24px rgba(0,0,0,.25)}
    html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#0b2b18,#06140d);color:white}
    body{min-height:100dvh}
    .game{width:min(430px,100vw);height:100dvh;margin:0 auto;padding:10px;display:grid;grid-template-rows:auto auto 1fr auto auto;gap:8px;overflow:hidden}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.55rem;flex-shrink:0}
    .brand h1{font-size:clamp(1.4rem,7vw,2rem);line-height:1;white-space:nowrap}.brand p{color:rgba(255,255,255,.7);font-size:.78rem;font-weight:700;margin-top:2px}
    .timer{background:#000;color:var(--gold);border-radius:999px;padding:9px 13px;font-weight:950;font-size:1.1rem;box-shadow:var(--shadow);white-space:nowrap}
    .players-panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:10px;min-height:105px;max-height:118px;overflow:hidden;box-shadow:var(--shadow)}
    .panel-title{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;font-weight:950;margin-bottom:8px}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .player{background:rgba(255,255,255,.94);color:var(--ink);border-radius:18px;min-height:68px;display:grid;place-items:center;padding:6px 4px;border:3px solid transparent;text-align:center}
    .player.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(247,212,74,.28)}.avatar{font-size:1.35rem;line-height:1}.name{font-size:.74rem;font-weight:950;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .count{background:var(--green2);color:white;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:950;line-height:1.25}
    .question-card{min-height:0;background:linear-gradient(135deg,#fffdf2,#fff1af);color:var(--ink);border-radius:28px;border:5px solid var(--gold);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;padding:12px;overflow:hidden}
    .question-inner{display:grid;place-items:center;gap:7px}.question-icon{font-size:clamp(2rem,10vw,3rem);line-height:1}.question-label{background:var(--green2);color:white;padding:6px 14px;border-radius:999px;font-size:.78rem;font-weight:950;max-width:100%}
    .question-text{font-size:clamp(1.45rem,8vw,2.45rem);line-height:1.02;font-weight:1000;letter-spacing:-.06em;padding:0 4px}
    .info-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:82px;max-height:90px}.info-card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:8px;display:grid;place-items:center;text-align:center;overflow:hidden}
    .info-card small{color:rgba(255,255,255,.65);font-weight:950;display:block;margin-bottom:4px;font-size:.72rem}.top-card{width:100%;max-width:110px;margin:0 auto;border-radius:16px;padding:6px;color:var(--ink);font-weight:950;font-size:.88rem;min-height:48px;display:grid;place-items:center;line-height:1.05}
    .match-rule{color:var(--gold);font-size:1.25rem;font-weight:1000;line-height:1.05}
    .hand-area{min-height:120px;max-height:142px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:9px;overflow:hidden}
    .hand-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-weight:950;font-size:.9rem}.hand-header span:last-child{color:rgba(255,255,255,.7);font-size:.72rem;font-weight:800}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;height:calc(100% - 28px)}
    .card{border-radius:16px;border:2px solid transparent;border-bottom-width:5px;padding:5px;color:var(--ink);display:grid;grid-template-rows:auto auto 1fr;place-items:center;text-align:center;min-width:0;cursor:pointer;overflow:hidden}
    .card.playable{outline:3px solid rgba(247,212,74,.78);border-color:white}.card.not-playable{opacity:.42;filter:grayscale(.3)}
    .card-icon{font-size:1.35rem;line-height:1}.card-name{font-size:.56rem;font-weight:1000;letter-spacing:.04em;line-height:1}.card-text{font-size:.62rem;font-weight:900;line-height:1.05;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .card-yellow{background:#F7DC6F;border-bottom-color:#D4AC0D}.card-blue{background:#5DADE2;border-bottom-color:#2E86C1}.card-green{background:#A3E4A3;border-bottom-color:#2E7D32}.card-red{background:#E74C3C;border-bottom-color:#B03A2E;color:white}.card-dark{background:#2C3E50;border-bottom-color:#1A252F;color:white}
    .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;min-height:54px}.btn{border:0;border-radius:18px;font-weight:1000;cursor:pointer;background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.16);font-size:.95rem}.btn.main{background:var(--gold);color:var(--ink);box-shadow:0 10px 18px rgba(0,0,0,.25)}
    .message{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);width:min(390px,calc(100vw - 24px));background:rgba(0,0,0,.78);color:#fff2a2;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 14px;text-align:center;font-size:.82rem;font-weight:850;z-index:20;pointer-events:none;opacity:0;transition:.2s}.message.show{opacity:1}
    .sheet,.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:50;padding:14px}.sheet.show,.modal.show{display:grid;place-items:end center}.sheet-card,.modal-card{width:min(420px,100%);background:#102b1b;border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:16px;color:white;box-shadow:var(--shadow)}
    .modal.show{place-items:center}.modal-card{background:#fffaf0;color:var(--ink);border:5px solid var(--gold);text-align:center}.modal-icon{font-size:3.4rem}.modal-label{display:inline-block;background:var(--green2);color:white;padding:6px 14px;border-radius:999px;margin:8px 0;font-weight:950}
    .modal-question{font-size:clamp(1.8rem,10vw,3rem);line-height:1.05;font-weight:1000;letter-spacing:-.06em;margin:8px 0 14px}.field{display:grid;gap:6px;margin:10px 0;color:rgba(255,255,255,.75);font-size:.8rem;font-weight:800}
    input,select{width:100%;border:0;border-radius:14px;padding:12px;font-weight:800;outline:none}.sheet-actions,.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    @media(max-height:720px){.game{gap:6px;padding:8px}.players-panel{min-height:94px;max-height:100px;padding:8px}.player{min-height:58px;border-radius:15px}.avatar{font-size:1.1rem}.question-text{font-size:clamp(1.25rem,7.2vw,2.05rem)}.info-row{min-height:72px;max-height:78px}.hand-area{min-height:104px;max-height:116px}.controls{min-height:48px}.logo{width:42px;height:42px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div class="brand"><div class="logo">🐦‍⬛</div><div><h1>Kauwe Bende</h1><p>One Screen Mobile</p></div></div>
      <div class="timer" id="timer">20:00</div>
    </header>

    <section class="players-panel">
      <div class="panel-title"><span>👥 Players</span><span id="directionLabel">↪</span></div>
      <div class="players" id="playersGrid"></div>
    </section>

    <section class="question-card">
      <div class="question-inner">
        <div class="question-icon" id="questionIcon">🎴</div>
        <div class="question-label" id="questionLabel">Current Question</div>
        <div class="question-text" id="questionText">Tap a playable card to begin.</div>
      </div>
    </section>

    <section class="info-row">
      <div class="info-card"><div><small>TOP CARD</small><div class="top-card" id="topCard">—</div></div></div>
      <div class="info-card"><div><small>MATCH</small><div class="match-rule" id="matchRule">ANY</div></div></div>
    </section>

    <section class="hand-area">
      <div class="hand-header"><span>🎴 Your Cards</span><span id="handInfo">0 playable</span></div>
      <div class="cards" id="cardsContainer"></div>
    </section>

    <nav class="controls">
      <button class="btn" onclick="toggleSetup()">⚙️ Setup</button>
      <button class="btn main" onclick="drawAndEnd()">Draw</button>
      <button class="btn" onclick="showBigQuestion()">🔎 Big</button>
    </nav>
  </main>

  <div class="message" id="message"></div>

  <div class="sheet" id="setupSheet" onclick="closeSetupOutside(event)">
    <div class="sheet-card">
      <h2>⚙️ Setup</h2>
      <label class="field">Round length
        <select id="timerSelect" onchange="setRoundLength()">
          <option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1200" selected>20 minutes</option><option value="1800">30 minutes</option>
        </select>
      </label>
      <label class="field">Player names, separated by comma
        <input id="playerNamesInput" value="You, Player 2, Player 3, Player 4">
      </label>
      <div class="sheet-actions"><button class="btn main" onclick="applyPlayers()">Apply</button><button class="btn" onclick="restartGame()">Restart</button></div>
      <div class="sheet-actions"><button class="btn" id="voiceBtn" onclick="toggleVoice()">🔇 Voice OFF</button><button class="btn" id="countBtn" onclick="toggleCountdown()">⏱ Count ON</button></div>
      <div class="sheet-actions"><button class="btn" onclick="toggleSetup()">Close</button><button class="btn" onclick="sortHand()">Sort Cards</button></div>
    </div>
  </div>

  <div class="modal" id="questionModal" onclick="closeModalOutside(event)">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon">🎴</div>
      <div class="modal-label" id="modalLabel">Question</div>
      <div class="modal-question" id="modalQuestion">Question appears here.</div>
      <div class="modal-actions"><button class="btn" onclick="repeatSpeech()">🔊 Listen</button><button class="btn main" onclick="hideModal()">Continue</button></div>
    </div>
  </div>

  <script>
    const ICONS=['🥚','🐦‍⬛','🪶','🪵'],ICON_NAMES=['Egg','Crow','Feather','Stick'],AVATARS=['🧑','🦊','🐸','🐻','🐼','🦉'];
    const questions={positive:["What made you smile today?","Who inspires you the most?","What are you grateful for right now?","What is something good that happened this week?","Who makes you laugh the most?"],future:["What does your perfect normal day look like?","What dream are you working toward?","Where do you see yourself in five years?","What new skill would you love to learn?","What place do you really want to visit?"],reflective:["What would you tell your younger self?","What challenge made you stronger?","What are you genuinely proud of?","What mistake taught you something valuable?","What is the best advice you received?"],competitive:["What are you weirdly good at?","What hidden talent do you have?","What game do you almost always win?","What could you teach others?","What is your personal superpower?"]};
    const cardTypes={positive:{name:"POSITIVE",color:"yellow",bgClass:"card-yellow"},future:{name:"FUTURE",color:"blue",bgClass:"card-blue"},reflective:{name:"REFLECTIVE",color:"green",bgClass:"card-green"},competitive:{name:"COMPETITIVE",color:"red",bgClass:"card-red"},plus2:{name:"+2",color:"dark",bgClass:"card-dark",action:"plus2",effect:"Draw 2 + skip"},skip:{name:"SKIP",color:"dark",bgClass:"card-dark",action:"skip",effect:"Skip next player"},reverse:{name:"REVERSE",color:"dark",bgClass:"card-dark",action:"reverse",effect:"Reverse direction"}};
    let deck=[],players=[],currentPlayerIndex=0,direction=1,currentTopCard=null,timeLeft=1200,timer=null,gameActive=true,readingDelay=false,lastQuestion=null,voiceEnabled=false,countdownEnabled=true;

    function randomIcon(){const i=Math.floor(Math.random()*ICONS.length);return{symbol:ICONS[i],name:ICON_NAMES[i]}}
    function createCard(t){const icon=randomIcon();return{...t,iconSymbol:icon.symbol,iconName:icon.name}}
    function buildDeck(){const d=[];Object.keys(questions).forEach(cat=>questions[cat].forEach(question=>d.push(createCard({...cardTypes[cat],type:cat,question}))));for(let i=0;i<2;i++){d.push(createCard({...cardTypes.plus2,type:"plus2"}));d.push(createCard({...cardTypes.skip,type:"skip"}));d.push(createCard({...cardTypes.reverse,type:"reverse"}))}return d.sort(()=>Math.random()-.5)}
    function canPlay(card){if(!gameActive||readingDelay||currentPlayerIndex!==0)return false;if(!currentTopCard)return true;return card.color===currentTopCard.color||card.iconSymbol===currentTopCard.iconSymbol}
    function playCard(index){if(!gameActive||readingDelay)return;if(currentPlayerIndex!==0){showMessage("Wait for your turn.");return}const card=players[0].hand[index];if(!canPlay(card)){showMessage("Match color or icon.");return}players[0].hand.splice(index,1);handleCard(card,0);if(players[0].hand.length===0){endGame("🏆 You won!");return}if(card.question){startQuestionDelay();return}nextTurn();render()}
    function handleCard(card,playerIndex){playSound(card.action?"action":"card");currentTopCard={name:card.name,color:card.color,iconSymbol:card.iconSymbol,iconName:card.iconName,question:card.question||null};if(card.question){lastQuestion=card;setQuestion(card);showModal(card)}else setAction(card);if(card.action==="plus2"){const target=getNextIndex();drawCards(target,2);currentPlayerIndex=target;showMessage(`${players[target].name} draws 2 and skips.`);nextTurn()}if(card.action==="skip"){const skipped=getNextIndex();currentPlayerIndex=skipped;showMessage(`${players[skipped].name} skipped.`);nextTurn()}if(card.action==="reverse"){direction*=-1;showMessage("Direction reversed.")}}
    function setQuestion(card){questionIcon.textContent=card.iconSymbol;questionLabel.textContent=`${card.name} · ${card.iconName}`;questionText.textContent=card.question}
    function setAction(card){questionIcon.textContent=card.iconSymbol;questionLabel.textContent=`${card.name} · Action`;questionText.textContent=card.effect||"Action card played."}
    function startQuestionDelay(){readingDelay=true;showMessage("Question time: 10 seconds.");render();setTimeout(()=>{if(gameActive)startCountdown()},10000)}
    function startCountdown(){if(!countdownEnabled){readingDelay=false;nextTurn();render();return}showMessage("Next player in 3...");speakCountdown("3");setTimeout(()=>{if(gameActive){showMessage("Next player in 2...");speakCountdown("2")}},1000);setTimeout(()=>{if(gameActive){showMessage("Next player in 1...");speakCountdown("1")}},2000);setTimeout(()=>{if(gameActive){readingDelay=false;nextTurn();render()}},3000)}
    function aiTurn(){if(!gameActive||currentPlayerIndex===0)return;const ai=players[currentPlayerIndex];const playableIndex=ai.hand.findIndex(c=>c.color===currentTopCard.color||c.iconSymbol===currentTopCard.iconSymbol);if(playableIndex>=0){const card=ai.hand.splice(playableIndex,1)[0];handleCard(card,currentPlayerIndex);if(ai.hand.length===0){endGame(`${ai.name} won!`);return}if(card.question){startQuestionDelay();return}}else{drawCards(currentPlayerIndex,1);playSound("draw");showMessage(`${ai.name} drew a card.`)}nextTurn();render()}
    function getNextIndex(){return(currentPlayerIndex+direction+players.length)%players.length}
    function nextTurn(){currentPlayerIndex=getNextIndex();render();if(currentPlayerIndex!==0&&gameActive)setTimeout(aiTurn,650)}
    function drawCards(i,a){for(let x=0;x<a;x++){if(!deck.length)deck=buildDeck();players[i].hand.push(deck.pop())}}
    function drawAndEnd(){if(!gameActive||readingDelay)return;if(currentPlayerIndex!==0){showMessage("Not your turn.");return}drawCards(0,1);playSound("draw");showMessage("You drew a card.");nextTurn();render()}
    function render(){directionLabel.textContent=direction===1?"↪":"↩";playersGrid.innerHTML=players.slice(0,4).map((p,i)=>`<div class="player ${currentPlayerIndex===i&&gameActive?'active':''}"><div class="avatar">${AVATARS[i]}</div><div class="name">${p.name}</div><div class="count">${p.hand.length}</div></div>`).join("");const colorMap={yellow:"#F7DC6F",blue:"#5DADE2",green:"#A3E4A3",red:"#E74C3C",dark:"#2C3E50"};if(currentTopCard){topCard.style.background=colorMap[currentTopCard.color];topCard.style.color=["red","dark"].includes(currentTopCard.color)?"#fff":"#102118";topCard.innerHTML=`${currentTopCard.iconSymbol}<br>${currentTopCard.name}`;matchRule.innerHTML=`${currentTopCard.color.toUpperCase()}<br>OR ${currentTopCard.iconSymbol}`}const hand=players[0].hand.slice(0,5),playableCount=players[0].hand.filter(canPlay).length;handInfo.textContent=`${playableCount} playable · ${players[0].hand.length} total`;cardsContainer.innerHTML=hand.map((card,i)=>`<div class="card ${card.bgClass} ${canPlay(card)?'playable':'not-playable'}" onclick="playCard(${i})"><div class="card-icon">${card.iconSymbol}</div><div class="card-name">${card.name}</div><div class="card-text">${card.question||card.effect||""}</div></div>`).join("")}
    function setRoundLength(){timeLeft=Number(timerSelect.value);updateTimer()}
    function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!gameActive)return;if(timeLeft<=0){endGame("Time is up!");return}timeLeft--;updateTimer()},1000)}
    function updateTimer(){const m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById("timer").textContent=`${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`}
    function showMessage(text){message.textContent=text;message.classList.add("show");clearTimeout(window.messageTimer);window.messageTimer=setTimeout(()=>message.classList.remove("show"),2400)}
    function showModal(card){modalIcon.textContent=card.iconSymbol;modalLabel.textContent=`${card.name} QUESTION`;modalQuestion.textContent=card.question;questionModal.classList.add("show");speakText(card.question);clearTimeout(window.modalTimer);window.modalTimer=setTimeout(hideModal,10000)}
    function hideModal(){questionModal.classList.remove("show")}function closeModalOutside(e){if(e.target.id==="questionModal")hideModal()}
    function showBigQuestion(){if(!lastQuestion){showMessage("No question yet.");return}showModal(lastQuestion)}
    function toggleSetup(){setupSheet.classList.toggle("show")}function closeSetupOutside(e){if(e.target.id==="setupSheet")toggleSetup()}
    function applyPlayers(){const names=playerNamesInput.value.split(",").map(n=>n.trim()).filter(Boolean);if(names.length<2){showMessage("Add at least 2 players.");return}initGame(names.slice(0,4));toggleSetup()}
    function restartGame(){const names=players.length?players.map(p=>p.name):["You","Player 2","Player 3","Player 4"];initGame(names);toggleSetup()}
    function sortHand(){const order={yellow:1,blue:2,green:3,red:4,dark:5};players[0].hand.sort((a,b)=>order[a.color]-order[b.color]);render()}
    function toggleVoice(){voiceEnabled=!voiceEnabled;voiceBtn.textContent=voiceEnabled?"🔊 Voice ON":"🔇 Voice OFF";if(!voiceEnabled)window.speechSynthesis?.cancel()}
    function toggleCountdown(){countdownEnabled=!countdownEnabled;countBtn.textContent=countdownEnabled?"⏱ Count ON":"⏱ Count OFF"}
    function speakText(text){window.lastSpeech=text;if(!voiceEnabled||!("speechSynthesis"in window))return;const speech=new SpeechSynthesisUtterance(text);speech.rate=.9;speech.lang="en-US";window.speechSynthesis.cancel();window.speechSynthesis.speak(speech)}
    function repeatSpeech(){if(!voiceEnabled){showMessage("Voice is off.");return}if(window.lastSpeech)speakText(window.lastSpeech)}
    function speakCountdown(text){if(!voiceEnabled||!("speechSynthesis"in window)){playSound("tick");return}const speech=new SpeechSynthesisUtterance(text);speech.rate=.9;window.speechSynthesis.cancel();window.speechSynthesis.speak(speech)}
    function playSound(type){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();const freq={card:520,action:220,draw:330,tick:760}[type]||520;osc.type="triangle";osc.frequency.value=freq;gain.gain.setValueAtTime(.025,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.08);setTimeout(()=>ctx.close(),150)}
    function endGame(text){gameActive=false;clearInterval(timer);questionIcon.textContent="🏆";questionLabel.textContent="Game finished";questionText.textContent=text;showMessage(text);render()}
    function initGame(names=["You","Player 2","Player 3","Player 4"]){deck=buildDeck();players=names.map(name=>({name,hand:[]}));currentPlayerIndex=0;direction=1;gameActive=true;readingDelay=false;lastQuestion=null;players.forEach((_,i)=>drawCards(i,3));let first=deck.pop();while(first.action){deck.unshift(first);first=deck.pop()}currentTopCard=first;setQuestion(first);setRoundLength();render();startTimer();showMessage("Everything fits in one screen.")}
    initGame();
  </script>
</body>
</html>
